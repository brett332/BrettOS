name: Deploy Tasks Sync Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/tasks-sync/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: |
          # CLASP_CREDENTIALS is stored as base64 of ~/.clasprc.json so that
          # copy/paste into the GitHub Secrets UI can't corrupt the JSON
          # with stray line breaks or whitespace (this is what broke the
          # first run: clasp failed with "Expected ',' or '}' after
          # property value in JSON at position 631").
          echo "$CLASP_CREDENTIALS_B64" | base64 -d > "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'))" \
            && echo "Credentials file is valid JSON." \
            || (echo "::error::~/.clasprc.json is not valid JSON after decoding CLASP_CREDENTIALS_B64 — the secret needs to be re-set (see repo notes)." && exit 1)
        env:
          CLASP_CREDENTIALS_B64: ${{ secrets.CLASP_CREDENTIALS_B64 }}

      - name: Push and deploy
        working-directory: apps-script/tasks-sync
        run: |
          clasp push --force
          clasp deploy -i AKfycbw9-FjmVfm86mQpzjvTDzrnHOy1HGCGvR4MIVBbEK6yHiYOoIaK1PQ0MWDCzhCEWLpT -d "auto-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
