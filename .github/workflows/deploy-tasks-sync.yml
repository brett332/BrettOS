name: Deploy Tasks Sync Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/tasks-sync/**'
      - '.github/scripts/deploy-apps-script.js'
      - '.github/workflows/deploy-tasks-sync.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deploy dependencies
        run: npm install googleapis
        working-directory: .github/scripts

      - name: Deploy via Apps Script API (service account)
        working-directory: .github/scripts
        run: node deploy-apps-script.js
        env:
          APPSSCRIPT_SA_KEY_B64: ${{ secrets.APPSSCRIPT_SA_KEY_B64 }}
